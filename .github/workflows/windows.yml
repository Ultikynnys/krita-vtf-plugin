name: Windows native plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      LLVM_MINGW_VERSION: 20251118
      LLVM_MINGW_ARCHIVE: llvm-mingw-20251118-ucrt-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Cache Krita dependency packages
        uses: actions/cache@v4
        with:
          path: C:\krita-env\cache
          key: krita-windows-master-qt5-v2

      - name: Install Python requirements
        shell: pwsh
        run: python -m pip install python-gitlab pyyaml requests lxml packaging

      - name: Download LLVM MinGW
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$env:LLVM_MINGW_ARCHIVE" -OutFile C:\llvm-mingw.zip
          Expand-Archive C:\llvm-mingw.zip C:\llvm-mingw
          $toolchain = (Get-ChildItem C:\llvm-mingw -Directory | Select-Object -First 1).FullName
          "LLVM_MINGW=$toolchain" | Out-File $env:GITHUB_ENV -Append

      - name: Clone Krita dependency utilities
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\krita-env | Out-Null
          git clone --depth 1 https://invent.kde.org/packaging/krita-deps-management.git C:\krita-deps
          git clone --depth 1 https://invent.kde.org/packaging/krita-ci-utilities.git C:\krita-deps\ci-utilities

      - name: Download official Krita Qt 5 dependencies
        shell: cmd
        working-directory: C:\krita-env
        run: >-
          python C:\krita-deps\tools\setup-env.py
          --full-krita-env
          -r C:\krita-env
          -p "%LLVM_MINGW%\bin"
          -p "C:\Program Files\CMake\bin"
          -p "C:\ProgramData\chocolatey\bin"
          -o krita-env
          -b master

      - name: Clone matching Krita source
        shell: cmd
        run: git clone --depth 1 https://invent.kde.org/graphics/krita.git C:\krita-src

      - name: Configure Qt image plugin
        shell: cmd
        working-directory: C:\krita-env
        run: >-
          call C:\krita-env\krita-env.bat &&
          set "CMAKE_PREFIX_PATH=C:\krita-env\_install" &&
          set "PATH=C:\krita-env\_install\bin;C:\krita-env\_install\lib;%LLVM_MINGW%\bin;%PATH%" &&
          copy /Y "%LLVM_MINGW%\bin\libc++.dll" C:\krita-env\_install\bin\ &&
          copy /Y "%LLVM_MINGW%\bin\libunwind.dll" C:\krita-env\_install\bin\ &&
          copy /Y "%GITHUB_WORKSPACE%\src\CMakeLists.qimageio.txt" "%GITHUB_WORKSPACE%\src\CMakeLists.txt" &&
          cmake -S "%GITHUB_WORKSPACE%\src" -B C:\vtf-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="%LLVM_MINGW%\bin\clang.exe"
          -DCMAKE_CXX_COMPILER="%LLVM_MINGW%\bin\clang++.exe"

      - name: Inject native VTF exporter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\krita-src\plugins\impex\vtf | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\src\*" C:\krita-src\plugins\impex\vtf -Recurse -Force
          Add-Content C:\krita-src\plugins\impex\CMakeLists.txt "`nadd_subdirectory(vtf)"
          if (-not (Select-String -Path C:\krita-src\plugins\impex\CMakeLists.txt -Pattern 'add_subdirectory\(vtf\)' -Quiet)) {
            throw 'Failed to register the native VTF exporter in Krita.'
          }

      - name: Configure native Krita exporter
        shell: cmd
        working-directory: C:\krita-env
        run: >-
          call C:\krita-env\krita-env.bat &&
          set "CMAKE_PREFIX_PATH=C:\krita-env\_install" &&
          set "PATH=C:\krita-env\_install\bin;C:\krita-env\_install\lib;%LLVM_MINGW%\bin;%PATH%" &&
          cmake -S C:\krita-src -B C:\krita-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=C:\krita-env\_install
          -DCMAKE_C_COMPILER="%LLVM_MINGW%\bin\clang.exe"
          -DCMAKE_CXX_COMPILER="%LLVM_MINGW%\bin\clang++.exe"
          -DBUILD_TESTING=OFF
          -DBUILD_KRITA_QT_DESIGNER_PLUGINS=OFF

      - name: Build Qt image plugin
        shell: cmd
        working-directory: C:\krita-env
        run: >-
          call C:\krita-env\krita-env.bat &&
          set "CMAKE_PREFIX_PATH=C:\krita-env\_install" &&
          set "PATH=C:\krita-env\_install\bin;%PATH%" &&
          cmake --build C:\vtf-build --target kimg_vtf --parallel 2

      - name: Build native Krita exporter
        shell: cmd
        working-directory: C:\krita-env
        run: >-
          call C:\krita-env\krita-env.bat &&
          set "PATH=C:\krita-env\_install\bin;%LLVM_MINGW%\bin;%PATH%" &&
          cmake --build C:\krita-build --target kritavtfexport --parallel 2

      - name: Run codec tests
        shell: cmd
        working-directory: C:\krita-env
        run: >-
          call C:\krita-env\krita-env.bat &&
          set "PATH=C:\krita-env\_install\bin;%LLVM_MINGW%\bin;%PATH%" &&
          cmake --build C:\vtf-build --target test_vtf_codec test_vtf_gui_dispatch --parallel 2 &&
          ctest --test-dir C:\vtf-build --output-on-failure

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact\bin\imageformats | Out-Null
          New-Item -ItemType Directory -Force artifact\bin\kritaplugins | Out-Null
          New-Item -ItemType Directory -Force artifact\share\mime\packages | Out-Null
          Copy-Item C:\vtf-build\kimg_vtf.dll artifact\bin\imageformats\
          $nativeExporter = Get-ChildItem C:\krita-build -Filter kritavtfexport.dll -Recurse | Select-Object -First 1
          if (-not $nativeExporter) { throw 'Native VTF exporter was not produced.' }
          Copy-Item $nativeExporter.FullName artifact\bin\kritaplugins\
          Copy-Item src\vtf.xml artifact\share\mime\packages\
          Copy-Item install.ps1 artifact\
          Copy-Item README.md artifact\

      - uses: actions/upload-artifact@v4
        with:
          name: krita-vtf-windows
          path: artifact
          if-no-files-found: error
